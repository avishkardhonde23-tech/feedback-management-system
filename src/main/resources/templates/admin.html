<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h2>Admin Dashboard</h2>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>
    </div>

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            All Feedbacks
        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Subject</th>
                    <th>Message</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="feedback : ${feedbacks}">

                    <td th:text="${feedback.id}"></td>
                    <td th:text="${feedback.subject}"></td>
                    <td th:text="${feedback.message}"></td>
                    <td th:text="${feedback.status}"></td>

                    <td>

                        <a th:href="@{/approve/{id}(id=${feedback.id})}"
                           class="btn btn-success btn-sm">
                            Approve
                        </a>

                        <a th:href="@{/reject/{id}(id=${feedback.id})}"
                           class="btn btn-warning btn-sm">
                            Reject
                        </a>

                        <a th:href="@{/admin/delete/{id}(id=${feedback.id})}"
                           class="btn btn-danger btn-sm">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
