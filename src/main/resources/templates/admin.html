<!DOCTYPE html>
<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<head>
    <title>Admin Dashboard</title>
</head>
<body>
<table border="1">

    <tr>
        <th>ID</th>
        <th>Subject</th>
        <th>Message</th>
        <th>Status</th>
    </tr>

    <tr th:each="feedback : ${feedbacks}">
        <td th:text="${feedback.id}"></td>
        <td th:text="${feedback.subject}"></td>
        <td th:text="${feedback.message}"></td>
        <td th:text="${feedback.status}"></td>

        <td>
            <a th:href="@{/approve/{id}(id=${feedback.id})}">
                <button>Approve</button>
            </a>
            <a th:href="@{/reject/{id}(id=${feedback.id})}">
                <button>Reject</button>
            </a>
            <a th:href="@{/admin/delete/{id}(id=${feedback.id})}">
                <button>Delete</button>
            </a>
        </td>
    </tr>

</table>
<a href="/logout">
    <button>Logout</button>
</a>

</body>
</html>
