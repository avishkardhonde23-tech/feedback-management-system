<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<head>
    <title>Edit Feedback</title>
</head>
<body>

<h2>Edit Feedback</h2>

<form th:action="@{/update/{id}(id=${feedback.id})}"
      method="post">

    Subject:
    <input type="text"
           name="subject"
           th:value="${feedback.subject}">
    <br><br>

    Message:
    <input type="text"
           name="message"
           th:value="${feedback.message}">
    <br><br>

    <button type="submit">
        Update Feedback
    </button>

</form>

</body>
</html>
