<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Edit Feedback</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center">
                    <h3>Edit Feedback</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/update/{id}(id=${feedback.id})}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="subject"
                                   th:value="${feedback.subject}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Message
                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      name="message"
                                      th:text="${feedback.message}">
                            </textarea>

                        </div>

                        <button class="btn btn-primary w-100">
                            Update Feedback
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
