<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Feedback Management</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Feedback Management</h1>

  <a href="/logout" class="btn btn-danger">
    Logout
  </a>
</div>

<!-- Add Feedback Form -->
<div class="card mb-4">
  <div class="card-header">
    Add Feedback
  </div>

  <div class="card-body">

    <form action="/feedbacks" method="POST">

      <div class="mb-3">
        <label class="form-label">Subject</label>
        <input type="text"
               name="subject"
               class="form-control"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="message"
                  rows="4"
                  class="form-control"
                  required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">
        Add Feedback
      </button>

    </form>

  </div>
</div>

<!-- Feedback List -->
<div class="card">
  <div class="card-header">
    Feedback List
  </div>

  <div class="card-body">

    <table class="table table-bordered table-striped">

      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Subject</th>
        <th>Message</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
      </thead>

      <tbody>

      <tr th:each="feedback : ${feedbacks}">

        <td th:text="${feedback.id}"></td>

        <td th:text="${feedback.subject}"></td>

        <td th:text="${feedback.message}"></td>

        <td>
                    <span th:if="${feedback.status == 'Pending'}"
                          class="badge bg-warning text-dark">
                        Pending
                    </span>

          <span th:if="${feedback.status == 'Approved'}"
                class="badge bg-success">
                        Approved
                    </span>

          <span th:if="${feedback.status == 'Rejected'}"
                class="badge bg-danger">
                        Rejected
                    </span>
        </td>

        <td>

          <a th:href="@{/edit/{id}(id=${feedback.id})}">
            <button class="btn btn-warning btn-sm">
              Edit
            </button>
          </a>

          <a th:href="@{/delete-feedback/{id}(id=${feedback.id})}">
            <button class="btn btn-danger btn-sm">
              Delete
            </button>
          </a>

        </td>

      </tr>

      </tbody>

    </table>

  </div>
</div>

</body>
</html>
