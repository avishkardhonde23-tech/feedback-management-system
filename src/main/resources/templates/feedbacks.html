<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <title>Feedback Management</title>
</head>
<body>

<h1>Feedback Management</h1>

<form action="/feedbacks" method="POST">

  <label>Subject:</label><br>
  <input type="text" name="subject"><br><br>

  <label>Message:</label><br>
  <textarea name="message" rows="4" cols="40"></textarea><br><br>


  <button type="submit">Add Feedback</button>

</form>

<hr>

<h2>Feedback List</h2>

<table border="1" cellpadding="10">

  <tr>
    <th>ID</th>
    <th>Subject</th>
    <th>Message</th>
    <th>Actions</th>
  </tr>

  <tr th:each="feedback : ${feedbacks}">
    <td th:text="${feedback.id}"></td>
    <td th:text="${feedback.subject}"></td>
    <td th:text="${feedback.message}"></td>
       <td>
      <a th:href="@{/edit/{id}(id=${feedback.id})}">
        <button>Edit</button>
      </a>
      <a th:href="@{delete-feedback/{id}(id=${feedback.id})}">
      <button>Delete</button>
      </a>

    </td>
  </tr>

</table>
<a href="/logout">
  <button>Logout</button>
</a>
</body>
</html>
